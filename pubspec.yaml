name: larg_editor
description: "Desktop editor and player for LARG script packs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # FDL 视觉体系（色板 / 圆角 / 字体令牌）
  fifty_theme: ^3.0.1
  fifty_tokens: ^3.2.0
  # 显式声明：app_theme 用它关掉 google_fonts 的运行时下载（防误触联网拉字体）
  google_fonts: ^8.2.1

  # 编辑器：导入导出 zip、选文件、媒体预览、分享
  archive: ^3.6.1
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  cross_file: ^0.3.5+5

  # 媒体播放（预览视频/音频/图片）。
  # 音频/视频统一走 video_player + fvp(libffmpeg 预编译，无外部下载)：
  # 官方 video_player 没有 Windows/Linux 实现，fvp 补位，且能解码纯音频文件；
  # 这样整个桌面端不再依赖 audioplayers（其 windows 实现要经 nuget 拉 WIX 包，
  # 本机 nuget 锁故障会卡死构建）。
  video_player: ^2.11.1
  fvp: ^0.38.1
  photo_view: ^0.15.0
  chewie: ^1.8.5
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 三语对应表（en / zh-CN / ja）
  assets:
    - lib/i18n/tables/

  # Manrope（OFL 1.1，见 lib/assets/fonts/OFL.txt）：FDL 规范字体。
  # 五个静态字重随包分发，构建期即内置，运行时零网络、零加载。
  # 中文不在 Manrope 内，由系统字体回退补齐。
  fonts:
    - family: Manrope
      fonts:
        - asset: lib/assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: lib/assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: lib/assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: lib/assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: lib/assets/fonts/Manrope-800.ttf
          weight: 800
